<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b8f"><title>SIX M STORE POS</title>
<style>
:root{--blue:#063b8f;--blue2:#0875d1;--bg:#f1f5fb;--ink:#17243b;--muted:#64748b;--line:#e3eaf4;--green:#159447;--red:#d33b42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans Bengali',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#e8eef8;color:var(--blue)}button.danger{background:#fff0f0;color:#b4232c}button.green{background:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh}.top{background:linear-gradient(110deg,#052d70,#0875d1);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #092c6230}.brand{font-size:20px;font-weight:850;letter-spacing:.3px}.sub{font-size:12px;opacity:.85}.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid #ffffff55;padding:6px 10px;border-radius:99px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1600px;margin:auto;min-height:calc(100vh - 65px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.nav{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;color:#34445e;margin:3px 0;padding:11px 12px;border-radius:10px}.nav.active,.nav:hover{background:#eaf2ff;color:var(--blue)}main{padding:20px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 2px 8px #1c35500a}.stat .num{font-size:25px;font-weight:850;margin-top:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;color:#53627a;font-weight:650}.field input,.field select,.field textarea,input.search{border:1px solid #d6dfec;border-radius:9px;padding:10px 11px;background:#fff;min-width:0;width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus,input.search:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0875d11a}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f9fd;color:#506078;font-size:12px}td .mini{padding:5px 8px;font-size:12px}.tag{display:inline-block;border-radius:99px;padding:4px 8px;background:#edf4ff;color:var(--blue);font-size:11px}.tag.green{background:#e9f8ef;color:#147a39}.tag.red{background:#fff0f0;color:#b4232c}.posgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);gap:14px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.product{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--ink);min-height:112px}.product:hover{border-color:var(--blue2);box-shadow:0 4px 14px #063b8f15}.product b{display:block;margin:7px 0}.product small{color:var(--muted)}.cartline{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 9px}.totalrow{display:flex;justify-content:space-between;padding:6px 0}.totalrow.big{font-size:20px;font-weight:850;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.modal{position:fixed;inset:0;background:#06152c88;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.show{display:flex}.dialog{background:white;border-radius:16px;padding:18px;width:min(720px,100%);max-height:92vh;overflow:auto}.toast{position:fixed;right:16px;bottom:16px;background:#14243c;color:white;padding:12px 16px;border-radius:10px;z-index:30;box-shadow:0 5px 20px #0003}.hide{display:none!important}.empty{text-align:center;padding:30px;color:var(--muted)}.actions{display:flex;gap:6px}.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(130deg,#052d70,#0875d1)}.loginbox{background:#fff;padding:26px;border-radius:18px;width:min(390px,100%);box-shadow:0 20px 60px #001a4c55}.loginbox h1{color:var(--blue);margin-bottom:5px}.notice{padding:10px 12px;background:#fff8e6;border:1px solid #f5df9b;border-radius:10px;font-size:12px;color:#785900;margin:12px 0}.foot{font-size:11px;color:var(--muted);margin-top:20px}.mobilebar{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;padding:8px;position:sticky;top:63px;z-index:4;border-right:0;border-bottom:1px solid var(--line)}.nav{width:auto;white-space:nowrap;margin:0;font-size:12px;padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.posgrid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:13px}.top{padding:11px 13px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.brand{font-size:17px}.sub{display:none}.grid{gap:8px}.stat{padding:12px}.stat .num{font-size:20px}.formgrid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.pagehead h1{font-size:20px}.topright .pill{display:none}}
</style></head><body><div id="root"></div>
<script>
(()=>{'use strict';
const KEY='sixmstore_pos_v2'; const $=s=>document.querySelector(s); const money=n=>'৳'+(Number(n)||0).toLocaleString('en-BD',{maximumFractionDigits:2});
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6); const today=()=>new Date().toISOString().slice(0,10);
const demo={products:[{id:'p101',name:'চাল (মিনিকেট)',sku:'SMS-001',barcode:'8901000000011',category:'মুদি',brand:'খোলা',unit:'কেজি',purchase:65,selling:78,stock:40,variants:[]},{id:'p102',name:'সয়াবিন তেল',sku:'SMS-002',barcode:'8901000000012',category:'মুদি',brand:'বোতল',unit:'লিটার',purchase:150,selling:170,stock:24,variants:[{id:'v1',name:'২ লিটার',price:330,stock:12,barcode:'8901000000013'}]},{id:'p103',name:'চিনি',sku:'SMS-003',barcode:'8901000000014',category:'মুদি',brand:'খোলা',unit:'কেজি',purchase:115,selling:125,stock:30,variants:[]},{id:'p104',name:'ডিটারজেন্ট পাউডার',sku:'SMS-004',barcode:'8901000000015',category:'ক্লিনিং',brand:'সাধারণ',unit:'প্যাকেট',purchase:45,selling:55,stock:18,variants:[] }],customers:[{id:'walkin',name:'সাধারণ ক্রেতা',phone:'',due:0}],sales:[],expenses:[],users:[{id:'u0',username:'superadmin',password:'1234',role:'super',active:true},{id:'u1',username:'admin1',password:'admin1',role:'admin',active:false},{id:'u2',username:'admin2',password:'admin2',role:'admin',active:false},{id:'u3',username:'admin3',password:'admin3',role:'admin',active:false},{id:'u4',username:'admin4',password:'admin4',role:'admin',active:false}],settings:{shop:'SIX M STORE',address:'চট্টগ্রাম, বাংলাদেশ',phone:'',apiUrl:'',apiKey:''},activity:[]};
let db=load(), user=null, page='dashboard', cart=[], scanBuffer='',scanTimer=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.products?x:structuredClone(demo)}catch(e){return structuredClone(demo)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));$('#saveState')&&($('#saveState').textContent='এই ডিভাইসে সংরক্ষিত');}
function log(msg){db.activity.unshift({date:new Date().toISOString(),user:user?.username||'system',msg});db.activity=db.activity.slice(0,300);save()}
function toast(msg){let t=$('#toast');if(!t)return;t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loginScreen(){ $('#root').innerHTML=`<div class="login"><div class="loginbox"><h1>SIX M STORE</h1><div class="muted">Super Shop • Point of Sale</div><div class="notice">প্রথমবার প্রবেশের ডেমো লগইন: <b>superadmin</b> / <b>1234</b>। প্রবেশের পর Settings থেকে পাসওয়ার্ড বদলান।</div><div class="field"><label>ইউজারনেম</label><input id="loginUser" value="superadmin" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>পাসওয়ার্ড</label><input id="loginPass" type="password" value="1234" autocomplete="current-password"></div><button id="loginBtn" style="width:100%;margin-top:15px">লগইন করুন</button><div class="foot">এই সংস্করণে ডেটা এই ব্রাউজার/ডিভাইসে থাকে। Google Sheets Sync চালু করতে আলাদা সেটআপ প্রয়োজন।</div></div></div>`;$('#loginBtn').onclick=()=>{let u=db.users.find(x=>x.username===$('#loginUser').value.trim()&&x.password===$('#loginPass').value&&x.active);if(!u){toast('ইউজারনেম বা পাসওয়ার্ড সঠিক নয়');return}user=u;render()};$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()}) }
const navs=[['dashboard','▦','ড্যাশবোর্ড'],['pos','▣','বিক্রয় / POS'],['products','□','পণ্য ও স্টক'],['sales','▤','বিক্রয় ইতিহাস'],['customers','♙','কাস্টমার'],['expenses','৳','খরচ'],['reports','▥','রিপোর্ট'],['settings','⚙','সেটিংস']];
function shell(){return `<div class="app"><header class="top"><div><div class="brand">SIX M STORE</div><div class="sub">Everyone Deserves Good Service</div></div><div class="topright"><span class="pill" id="saveState">অফলাইন-প্রস্তুত</span><span class="pill">${esc(user.username)} • ${user.role==='super'?'Super Admin':'Admin'}</span><button class="secondary" id="logout">লগআউট</button></div></header><div class="layout"><aside>${navs.map(n=>`<button class="nav ${page===n[0]?'active':''}" data-page="${n[0]}">${n[1]} ${n[2]}</button>`).join('')}</aside><main id="main"></main></div><div id="toast" class="toast hide"></div><div class="foot" style="padding:0 20px 15px">SIX M STORE POS • Offline-first • ডেটা নিয়মিত Export/Backup করুন</div></div>`}
function render(){if(!user){loginScreen();return}$('#root').innerHTML=shell();$('#logout').onclick=()=>{user=null;cart=[];loginScreen()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});drawPage()}
function drawPage(){let m=$('#main');if(page==='dashboard')m.innerHTML=dashboard();if(page==='pos')m.innerHTML=posPage();if(page==='products')m.innerHTML=productsPage();if(page==='sales')m.innerHTML=salesPage();if(page==='customers')m.innerHTML=customersPage();if(page==='expenses')m.innerHTML=expensesPage();if(page==='reports')m.innerHTML=reportsPage();if(page==='settings')m.innerHTML=settingsPage();bindPage()}
function dashboard(){let rev=db.sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.total,0),count=db.sales.filter(s=>s.date===today()).length,stock=db.products.reduce((a,p)=>a+Number(p.stock||0),0),low=db.products.filter(p=>Number(p.stock)<5).length;return `<div class="pagehead"><div><h1>ড্যাশবোর্ড</h1><div class="muted">আজকের দোকানের সারসংক্ষেপ • ${today()}</div></div><button onclick="window.print()" class="secondary">প্রিন্ট</button></div><div class="grid"><div class="stat"><div class="muted">আজকের বিক্রয়</div><div class="num">${money(rev)}</div></div><div class="stat"><div class="muted">আজকের বিল</div><div class="num">${count}</div></div><div class="stat"><div class="muted">মোট পণ্য</div><div class="num">${db.products.length}</div></div><div class="stat"><div class="muted">কম স্টক (৫-এর কম)</div><div class="num" style="color:${low?'#c0392b':'#159447'}">${low}</div></div></div><div class="panel" style="margin-top:14px"><h2>সাম্প্রতিক বিক্রয়</h2>${salesTable(db.sales.slice(0,8))}</div><div class="notice">গুরুত্বপূর্ণ: এটি অফলাইন-প্রথম সংস্করণ। ডেটা এই ডিভাইসের ব্রাউজারে সংরক্ষিত হয়; অন্য মোবাইল/কম্পিউটারে নিজে থেকে যাবে না।</div>`}
function posPage(){return `<div class="pagehead"><div><h1>বিক্রয় / POS</h1><div class="muted">বারকোড স্ক্যানার বা পণ্য নির্বাচন করে বিল তৈরি করুন</div></div><span class="tag green">Offline Ready</span></div><div class="posgrid"><section class="panel"><div class="row"><input id="scan" class="search" placeholder="বারকোড স্ক্যান / পণ্যের নাম লিখে Enter চাপুন" autofocus><button id="scanAdd">যোগ করুন</button></div><div class="row" style="margin-top:10px"><input id="productSearch" class="search" placeholder="পণ্য খুঁজুন..." style="flex:1"><select id="categoryFilter"><option value="">সব ক্যাটাগরি</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="productGrid" class="products">${productCards(db.products)}</div></section><section class="panel"><div class="row between"><h2>বর্তমান বিল</h2><button class="danger" id="clearCart">খালি করুন</button></div><div class="field"><label>কাস্টমার</label><select id="cartCustomer">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)} ${c.phone?'('+esc(c.phone)+')':''}</option>`).join('')}</select></div><div id="cartLines" style="margin-top:12px">${cartHTML()}</div><div class="field" style="margin-top:10px"><label>ডিসকাউন্ট (৳)</label><input id="discount" type="number" min="0" value="0"></div><div class="field" style="margin-top:8px"><label>পেমেন্ট পদ্ধতি</label><select id="payment"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Card</option><option>Due</option></select></div><div class="totalrow"><span>সাবটোটাল</span><b id="subtotal">${money(cartTotal())}</b></div><div class="totalrow"><span>ডিসকাউন্ট</span><b id="discountView">৳0</b></div><div class="totalrow big"><span>সর্বমোট</span><b id="grand">${money(cartTotal())}</b></div><button class="green" id="checkout" style="width:100%;margin-top:12px" ${cart.length?'':'disabled'}>বিল সম্পন্ন করুন</button></section></div>`}
function productCards(list){return list.map(p=>`<button class="product" data-add="${p.id}"><span class="tag">${esc(p.category)}</span><b>${esc(p.name)}</b><small>${esc(p.brand||'')} • স্টক ${p.stock} ${esc(p.unit||'')}</small><div style="font-weight:800;color:#0875d1;margin-top:6px">${money(p.selling)}</div></button>`).join('')||'<div class="empty">কোনো পণ্য পাওয়া যায়নি</div>'}
function cartTotal(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}function cartHTML(){return cart.map((x,i)=>`<div class="cartline"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} × ${x.qty}</div></div><div class="qty"><button class="secondary" data-dec="${i}">−</button><b>${x.qty}</b><button class="secondary" data-inc="${i}">+</button><button class="danger" data-remove="${i}">×</button></div></div>`).join('')||'<div class="empty">বিল খালি। বাম পাশ থেকে পণ্য যোগ করুন।</div>'}
function productsPage(){return `<div class="pagehead"><div><h1>পণ্য ও স্টক</h1><div class="muted">পণ্য যোগ, সম্পাদনা, বারকোড ও স্টক নিয়ন্ত্রণ</div></div><button id="addProduct">+ নতুন পণ্য</button></div><div class="panel"><div class="row"><input id="prodSearch" class="search" placeholder="নাম / SKU / বারকোড দিয়ে খুঁজুন" style="flex:1"><button class="secondary" id="exportProducts">CSV Export</button></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>পণ্য</th><th>SKU / Barcode</th><th>ক্রয়</th><th>বিক্রয়</th><th>স্টক</th><th>কাজ</th></tr></thead><tbody id="prodRows">${productRows(db.products)}</tbody></table></div></div>`}
function productRows(arr){return arr.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} • ${esc(p.brand||'')}</div></td><td>${esc(p.sku)}<div class="muted">${esc(p.barcode)}</div></td><td>${money(p.purchase)}</td><td>${money(p.selling)}</td><td><span class="tag ${p.stock<5?'red':'green'}">${p.stock} ${esc(p.unit)}</span></td><td class="actions"><button class="mini secondary" data-edit="${p.id}">Edit</button><button class="mini danger" data-delete="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">পণ্য নেই</td></tr>'}
function salesTable(arr){return `<div class="tablewrap"><table><thead><tr><th>বিল নম্বর</th><th>তারিখ</th><th>কাস্টমার</th><th>পেমেন্ট</th><th>মোট</th><th>কাজ</th></tr></thead><tbody>${arr.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.date)}</td><td>${esc(s.customerName)}</td><td>${esc(s.payment)}</td><td><b>${money(s.total)}</b></td><td><button class="mini secondary" data-receipt="${s.id}">রসিদ</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">এখনো বিক্রয় রেকর্ড নেই</td></tr>'}</tbody></table></div>`}
function salesPage(){return `<div class="pagehead"><div><h1>বিক্রয় ইতিহাস</h1><div class="muted">সম্পন্ন হওয়া সব বিল</div></div><button class="secondary" id="exportSales">CSV Export</button></div><div class="panel">${salesTable([...db.sales].reverse())}</div>`}
function customersPage(){return `<div class="pagehead"><div><h1>কাস্টমার</h1><div class="muted">ক্রেতার তথ্য ও বকেয়া</div></div><button id="addCustomer">+ কাস্টমার যোগ</button></div><div class="panel tablewrap"><table><thead><tr><th>নাম</th><th>মোবাইল</th><th>বকেয়া</th><th>কাজ</th></tr></thead><tbody>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'-')}</td><td>${money(c.due)}</td><td><button class="mini secondary" data-customer-edit="${c.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function expensesPage(){return `<div class="pagehead"><div><h1>দোকানের খরচ</h1><div class="muted">ভাড়া, বিদ্যুৎ, পরিবহনসহ অন্যান্য খরচ</div></div><button id="addExpense">+ খরচ যোগ</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>তারিখ</th><th>খাত</th><th>বিবরণ</th><th>টাকা</th></tr></thead><tbody>${[...db.expenses].reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.note||'')}</td><td>${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">কোনো খরচ নেই</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){let rev=db.sales.reduce((a,s)=>a+s.total,0),cost=db.sales.reduce((a,s)=>a+s.items.reduce((z,i)=>z+i.purchase*i.qty,0),0),exp=db.expenses.reduce((a,e)=>a+e.amount,0);return `<div class="pagehead"><div><h1>রিপোর্ট</h1><div class="muted">সব সময়ের সারসংক্ষেপ</div></div><button class="secondary" id="backup">Backup JSON</button></div><div class="grid"><div class="stat"><div class="muted">মোট বিক্রয়</div><div class="num">${money(rev)}</div></div><div class="stat"><div class="muted">বিক্রীত পণ্যের ক্রয়মূল্য</div><div class="num">${money(cost)}</div></div><div class="stat"><div class="muted">মোট খরচ</div><div class="num">${money(exp)}</div></div><div class="stat"><div class="muted">আনুমানিক লাভ</div><div class="num">${money(rev-cost-exp)}</div></div></div><div class="notice">আনুমানিক লাভ = বিক্রয় − বিক্রীত পণ্যের ক্রয়মূল্য − রেকর্ড করা খরচ। বকেয়া, VAT, ফেরত ও অন্যান্য হিসাব যোগ না করলে এটি চূড়ান্ত হিসাব নয়।</div><div class="panel" style="margin-top:12px"><h2>কম স্টক পণ্য</h2>${productRows(db.products.filter(p=>p.stock<5))}</div>`}
function settingsPage(){return `<div class="pagehead"><div><h1>সেটিংস ও ব্যাকআপ</h1><div class="muted">দোকানের তথ্য, পাসওয়ার্ড, ডেটা ব্যাকআপ ও Sheets সংযোগ</div></div></div><div class="panel"><h2>দোকানের তথ্য</h2><div class="formgrid"><div class="field"><label>দোকানের নাম</label><input id="shopName" value="${esc(db.settings.shop)}"></div><div class="field"><label>মোবাইল</label><input id="shopPhone" value="${esc(db.settings.phone)}"></div><div class="field"><label>ঠিকানা</label><input id="shopAddress" value="${esc(db.settings.address)}"></div></div><button id="saveShop" style="margin-top:12px">তথ্য সংরক্ষণ</button></div><div class="panel" style="margin-top:12px"><h2>পাসওয়ার্ড পরিবর্তন</h2><div class="formgrid"><div class="field"><label>বর্তমান পাসওয়ার্ড</label><input id="oldPass" type="password"></div><div class="field"><label>নতুন পাসওয়ার্ড</label><input id="newPass" type="password"></div><div class="field"><label>নতুন পাসওয়ার্ড আবার লিখুন</label><input id="newPass2" type="password"></div></div><button id="changePass" style="margin-top:12px">পাসওয়ার্ড বদলান</button></div><div class="panel" style="margin-top:12px"><h2>ব্যাকআপ / রিস্টোর</h2><div class="row"><button id="backup2" class="secondary">ডেটা Backup ডাউনলোড</button><label class="secondary" style="padding:10px 14px;border-radius:10px;cursor:pointer">Backup Restore <input type="file" id="restoreFile" accept="application/json" hidden></label><button id="resetDemo" class="danger">ডেমো ডেটা রিসেট</button></div><div class="notice">প্রতি দিন কাজ শেষে Backup ডাউনলোড করে নিরাপদে রাখুন। ব্রাউজারের ডেটা মুছে গেলে লোকাল ডেটা হারাতে পারে।</div></div><div class="panel" style="margin-top:12px"><h2>Google Sheets Sync (ঐচ্ছিক)</h2><div class="notice">এই ফোল্ডারের Code.gs Apps Script-এ বসিয়ে Web App Deploy করার পর URL এখানে বসাতে হবে। Sync চালুর আগে ডেটার Backup নিন। URL/Key সেট না করা পর্যন্ত ক্লাউড Sync বন্ধ থাকবে।</div><div class="formgrid"><div class="field" style="grid-column:span 2"><label>Apps Script Web App URL</label><input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(db.settings.apiUrl)}"></div><div class="field"><label>Sync Key</label><input id="apiKey" value="${esc(db.settings.apiKey)}"></div></div><div class="row" style="margin-top:12px"><button id="saveApi">সংযোগ তথ্য সংরক্ষণ</button><button id="syncNow" class="green">এখন Sync করুন</button></div></div>${user.role==='super'?`<div class="panel" style="margin-top:12px"><h2>ব্যবহারকারী</h2>${db.users.map(u=>`<div class="row between" style="padding:8px;border-bottom:1px solid var(--line)"><span>${esc(u.username)} • ${u.role}</span><span class="tag ${u.active?'green':'red'}">${u.active?'Active':'Disabled'}</span></div>`).join('')}<div class="muted">নতুন Admin তৈরি ও পূর্ণ অনুমতি নিয়ন্ত্রণ এই সংস্করণে সীমিত; ডিফল্ট পাসওয়ার্ড পরিবর্তন করুন।</div></div>`:''}`}
function bindPage(){let on=(id,fn)=>{let x=$('#'+id);if(x)x.onclick=fn};if(page==='pos'){let scan=()=>{let v=$('#scan').value.trim();if(!v)return;let p=db.products.find(p=>p.barcode===v||p.sku.toLowerCase()===v.toLowerCase()||p.name.toLowerCase()===v.toLowerCase());if(!p){toast('এই বারকোড/পণ্য পাওয়া যায়নি');return}addCart(p);$('#scan').value=''};on('scanAdd',scan);$('#scan').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scan()}});$('#productSearch').oninput=filterProducts;$('#categoryFilter').onchange=filterProducts;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(db.products.find(p=>p.id===b.dataset.add)));on('clearCart',()=>{cart=[];drawPage()});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[+b.dataset.inc].qty++;drawPage()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let i=+b.dataset.dec;cart[i].qty--;if(cart[i].qty<1)cart.splice(i,1);drawPage()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);drawPage()});on('checkout',checkout);$('#discount').oninput=calcTotal}
if(page==='products'){on('addProduct',()=>productModal());$('#prodSearch').oninput=()=>{$('#prodRows').innerHTML=productRows(db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes($('#prodSearch').value.toLowerCase())));bindProductRows()};bindProductRows();on('exportProducts',()=>csv('products.csv',['name','sku','barcode','category','brand','purchase','selling','stock','unit'],db.products))}
if(page==='sales'){document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receipt(db.sales.find(s=>s.id===b.dataset.receipt)));on('exportSales',()=>csv('sales.csv',['id','date','customerName','payment','subtotal','discount','total'],db.sales))}
if(page==='customers'){on('addCustomer',()=>customerModal());document.querySelectorAll('[data-customer-edit]').forEach(b=>b.onclick=()=>customerModal(db.customers.find(c=>c.id===b.dataset.customerEdit)))}
if(page==='expenses')on('addExpense',expenseModal);
if(page==='reports'){on('backup',backup)}
if(page==='settings'){on('saveShop',()=>{db.settings.shop=$('#shopName').value;db.settings.phone=$('#shopPhone').value;db.settings.address=$('#shopAddress').value;save();toast('দোকানের তথ্য সংরক্ষিত')});on('changePass',()=>{if(user.password!==$('#oldPass').value)return toast('বর্তমান পাসওয়ার্ড ভুল');let p=$('#newPass').value;if(p.length<6||p!==$('#newPass2').value)return toast('নতুন পাসওয়ার্ড মিলছে না বা ৬ অক্ষরের কম');user.password=p;let u=db.users.find(x=>x.id===user.id);u.password=p;save();toast('পাসওয়ার্ড পরিবর্তন হয়েছে')});on('backup2',backup);on('restoreFile',()=>{});$('#restoreFile').onchange=restore;on('resetDemo',()=>{if(confirm('সব ডেটা মুছে ডেমো ডেটা ফিরিয়ে আনবেন?')){db=structuredClone(demo);save();render()}});on('saveApi',()=>{db.settings.apiUrl=$('#apiUrl').value.trim();db.settings.apiKey=$('#apiKey').value.trim();save();toast('Sync সেটিংস সংরক্ষিত')});on('syncNow',syncNow)}}
function filterProducts(){let q=$('#productSearch').value.toLowerCase(),c=$('#categoryFilter').value;$('#productGrid').innerHTML=productCards(db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)&&(!c||p.category===c)));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(db.products.find(p=>p.id===b.dataset.add)))}
function addCart(p){if(!p)return;if(p.stock<=0)return toast('স্টক শেষ');let x=cart.find(x=>x.productId===p.id);if(x){if(x.qty>=p.stock)return toast('স্টকের চেয়ে বেশি বিক্রি করা যাবে না');x.qty++}else cart.push({productId:p.id,name:p.name,price:Number(p.selling),purchase:Number(p.purchase),qty:1,barcode:p.barcode});drawPage()}
function calcTotal(){let sub=cartTotal(),d=Math.max(0,Number($('#discount').value)||0);$('#subtotal').textContent=money(sub);$('#discountView').textContent=money(d);$('#grand').textContent=money(Math.max(0,sub-d))}
function checkout(){if(!cart.length)return;let discount=Math.max(0,Number($('#discount').value)||0),sub=cartTotal();if(discount>sub)return toast('ডিসকাউন্ট সাবটোটালের বেশি হতে পারবে না');for(let i of cart){let p=db.products.find(p=>p.id===i.productId);if(!p||p.stock<i.qty)return toast(i.name+' এর পর্যাপ্ত স্টক নেই')}let customer=db.customers.find(c=>c.id===$('#cartCustomer').value)||db.customers[0],payment=$('#payment').value,total=sub-discount;let s={id:'SMS-'+Date.now().toString().slice(-8),date:today(),time:new Date().toLocaleTimeString('bn-BD'),customerId:customer.id,customerName:customer.name,payment,items:cart.map(x=>({...x})),subtotal:sub,discount,total};cart.forEach(i=>{let p=db.products.find(p=>p.id===i.productId);p.stock-=i.qty});if(payment==='Due')customer.due=(Number(customer.due)||0)+total;db.sales.push(s);log('বিক্রয় সম্পন্ন '+s.id+' '+money(total));save();cart=[];receipt(s);drawPage();toast('বিক্রয় সম্পন্ন হয়েছে')}
function productModal(p){let edit=!!p;let d=document.createElement('div');d.className='modal show';d.innerHTML=`<div class="dialog"><div class="row between"><h2>${edit?'পণ্য সম্পাদনা':'নতুন পণ্য যোগ'}</h2><button class="secondary" id="close">বন্ধ</button></div><div class="formgrid"><div class="field"><label>পণ্যের নাম *</label><input id="fName" value="${esc(p?.name||'')}"></div><div class="field"><label>SKU</label><input id="fSku" value="${esc(p?.sku||'')}"></div><div class="field"><label>বারকোড</label><input id="fBarcode" value="${esc(p?.barcode||'')}"></div><div class="field"><label>ক্যাটাগরি</label><input id="fCat" value="${esc(p?.category||'মুদি')}"></div><div class="field"><label>ব্র্যান্ড</label><input id="fBrand" value="${esc(p?.brand||'')}"></div><div class="field"><label>একক</label><input id="fUnit" value="${esc(p?.unit||'পিস')}"></div><div class="field"><label>ক্রয়মূল্য</label><input id="fPurchase" type="number" min="0" value="${p?.purchase??0}"></div><div class="field"><label>বিক্রয়মূল্য</label><input id="fSelling" type="number" min="0" value="${p?.selling??0}"></div><div class="field"><label>স্টক</label><input id="fStock" type="number" min="0" value="${p?.stock??0}"></div></div><div class="notice">এই সংস্করণে একই পণ্যের প্যাক সাইজ/ভ্যারিয়েন্ট আলাদা SKU/বারকোডসহ আলাদা পণ্য হিসেবে যোগ করুন। এতে প্রতিটি সাইজের স্টক ঠিকভাবে হিসাব হবে।</div><button id="saveProduct" style="width:100%">সংরক্ষণ</button></div>`;document.body.append(d);d.querySelector('#close').onclick=()=>d.remove();d.querySelector('#saveProduct').onclick=()=>{let name=d.querySelector('#fName').value.trim();if(!name)return toast('পণ্যের নাম দিন');let x={id:p?.id||uid('p'),name,sku:d.querySelector('#fSku').value.trim()||uid('SKU'),barcode:d.querySelector('#fBarcode').value.trim(),category:d.querySelector('#fCat').value.trim(),brand:d.querySelector('#fBrand').value.trim(),unit:d.querySelector('#fUnit').value.trim(),purchase:+d.querySelector('#fPurchase').value,selling:+d.querySelector('#fSelling').value,stock:+d.querySelector('#fStock').value};if(p)Object.assign(p,x);else db.products.push(x);save();d.remove();drawPage();toast('পণ্য সংরক্ষণ হয়েছে')}}
function bindProductRows(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productModal(db.products.find(p=>p.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('পণ্যটি মুছে ফেলবেন?')){db.products=db.products.filter(p=>p.id!==b.dataset.delete);save();drawPage()}})}
function customerModal(c){let d=document.createElement('div');d.className='modal show';d.innerHTML=`<div class="dialog"><h2>${c?'কাস্টমার সম্পাদনা':'নতুন কাস্টমার'}</h2><div class="formgrid"><div class="field"><label>নাম</label><input id="cName" value="${esc(c?.name||'')}"></div><div class="field"><label>মোবাইল</label><input id="cPhone" value="${esc(c?.phone||'')}"></div><div class="field"><label>বকেয়া</label><input id="cDue" type="number" value="${c?.due||0}"></div></div><div class="row" style="margin-top:12px"><button id="cSave">সংরক্ষণ</button><button class="secondary" id="cClose">বন্ধ</button></div></div>`;document.body.append(d);d.querySelector('#cClose').onclick=()=>d.remove();d.querySelector('#cSave').onclick=()=>{let x={id:c?.id||uid('c'),name:d.querySelector('#cName').value.trim(),phone:d.querySelector('#cPhone').value.trim(),due:+d.querySelector('#cDue').value};if(!x.name)return toast('নাম দিন');if(c)Object.assign(c,x);else db.customers.push(x);save();d.remove();drawPage()}}
function expenseModal(){let d=document.createElement('div');d.className='modal show';d.innerHTML=`<div class="dialog"><h2>নতুন খরচ</h2><div class="formgrid"><div class="field"><label>তারিখ</label><input id="eDate" type="date" value="${today()}"></div><div class="field"><label>খরচের খাত</label><input id="eCat" placeholder="যেমন: ভাড়া"></div><div class="field"><label>টাকা</label><input id="eAmount" type="number" min="0"></div><div class="field" style="grid-column:span 2"><label>বিবরণ</label><input id="eNote"></div></div><div class="row" style="margin-top:12px"><button id="eSave">সংরক্ষণ</button><button class="secondary" id="eClose">বন্ধ</button></div></div>`;document.body.append(d);d.querySelector('#eClose').onclick=()=>d.remove();d.querySelector('#eSave').onclick=()=>{let amount=+d.querySelector('#eAmount').value;if(amount<=0)return toast('সঠিক টাকার পরিমাণ দিন');db.expenses.push({id:uid('e'),date:d.querySelector('#eDate').value,category:d.querySelector('#eCat').value,note:d.querySelector('#eNote').value,amount});save();d.remove();drawPage()}}
function receipt(s){let w=window.open('','_blank','width=420,height=650');if(!w){toast('রসিদ দেখাতে Popup অনুমতি দিন');return}w.document.write(`<html lang="bn"><meta charset="utf-8"><title>${s.id}</title><style>body{font-family:Arial,sans-serif;padding:18px}h2,p{text-align:center;margin:5px}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:7px;border-bottom:1px dashed #aaa;text-align:left}.r{text-align:right}</style><h2>${esc(db.settings.shop)}</h2><p>${esc(db.settings.address)}</p><p>${esc(db.settings.phone)}</p><hr><p>বিল: ${esc(s.id)} | ${esc(s.date)}</p><p>কাস্টমার: ${esc(s.customerName)}</p><table><tr><th>পণ্য</th><th>পরিমাণ</th><th>মোট</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty} × ${i.price}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><p class="r">সাবটোটাল: ${money(s.subtotal)}</p><p class="r">ডিসকাউন্ট: ${money(s.discount)}</p><h3 class="r">সর্বমোট: ${money(s.total)}</h3><p>পেমেন্ট: ${esc(s.payment)}</p><hr><p>আপনার বিশ্বাসই আমাদের মূলধন।</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function csv(name,keys,arr){let rows=[keys.join(','),...arr.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download(name,'\ufeff'+rows,'text/csv;charset=utf-8')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function backup(){download('SIX-M-STORE-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw 0;if(confirm('বর্তমান ডেটা Backup করে নতুন ডেটা Restore করবেন?')){backup();db=x;save();toast('Restore সম্পন্ন');render()}}catch(_){toast('Backup ফাইল সঠিক নয়')}};r.readAsText(f)}
async function syncNow(){let u=db.settings.apiUrl,k=db.settings.apiKey;if(!u||!k)return toast('আগে Apps Script URL ও Sync Key দিন');try{let res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',key:k,data:db})});let j=await res.json();if(!j.ok)throw Error(j.error||'Sync failed');toast('Google Sheets-এ Backup Sync হয়েছে')}catch(e){toast('Sync হয়নি: '+e.message)}}
// Keyboard barcode scanners type digits then Enter; input stays focused while POS is open.
document.addEventListener('keydown',e=>{if(page!=='pos'||!user||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='Enter'&&scanBuffer){$('#scan').value=scanBuffer;$('#scanAdd').click();scanBuffer='';return}if(e.key.length===1){scanBuffer+=e.key;clearTimeout(scanTimer);scanTimer=setTimeout(()=>scanBuffer='',500)}});
save();loginScreen();
})();
</script></body></html>
